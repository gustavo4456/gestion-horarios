<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Búsqueda de Horario - Gestor Académico</title>
</head>

<!-- ⚡ Estructura Flexbox para asegurar el footer abajo -->

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú Superior -->
    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <!-- Contenedor Principal Centrado -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-4">

                <!-- Tarjeta de Búsqueda -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                    <!-- Encabezado de la Tarjeta -->
                    <div class="card-header bg-dark text-white p-4 border-0 text-center">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center"
                            style="width: 50px; height: 50px;">
                            <i class="bi bi-search fs-4"></i>
                        </div>
                        <h4 class="mb-0 fw-bold">Localizar Horario</h4>
                        <small class="text-secondary">Búsqueda directa por registro único</small>
                    </div>

                    <!-- Cuerpo del Formulario -->
                    <div class="card-body p-4 bg-white">
                        <form th:action="@{/horario/buscando}" method="get">

                            <!-- Campo: ID único -->
                            <div class="mb-4">
                                <label for="id" class="form-label fw-semibold text-muted">ID del Horario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-end-0">
                                        <i class="bi bi-hash"></i>
                                    </span>
                                    <input type="number" name="id" id="id" class="form-control ps-2"
                                        placeholder="Ej: 45" min="1" required>
                                </div>
                                <div class="form-text text-muted small mt-2">
                                    Ingresá el número de índice que querés consultar en el sistema.
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid pt-2">
                                <button type="submit"
                                    class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-binoculars-fill"></i> Iniciar Búsqueda
                                </button>
                            </div>

                        </form>
                    </div>

                </div> <!-- /card -->

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragmentos/menu :: footer}"></footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
