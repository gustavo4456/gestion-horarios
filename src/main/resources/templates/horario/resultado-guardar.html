<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Horario Guardado - Gestor Académico</title>
</head>

<!-- ⚡ Estructura Flexbox para asegurar el footer abajo -->

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú Superior -->
    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <!-- Contenedor Principal Centrado -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Tarjeta de Éxito / Confirmación -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden" th:object="${horarioBD}">

                    <!-- Encabezado con Check de Éxito -->
                    <div class="card-header bg-success text-white p-4 border-0 text-center">
                        <div class="bg-white bg-opacity-20 text-white rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center shadow-sm"
                            style="width: 60px; height: 60px;">
                            <i class="bi bi-check2-circle fs-2"></i>
                        </div>
                        <h4 class="mb-1 fw-bold">¡Horario Guardado!</h4>
                        <p class="text-white-50 small mb-0">El registro se almacenó correctamente en la base de datos
                        </p>
                    </div>

                    <!-- Cuerpo: Datos del Horario en Lista Limpia -->
                    <div class="card-body p-4 bg-white">
                        <h6 class="text-uppercase text-muted fw-bold small mb-3" style="letter-spacing: 0.5px;">Resumen
                            del registro:</h6>

                        <ul class="list-group list-group-flush mb-4 border rounded-3 overflow-hidden">

                            <!-- Materia -->
                            <li class="list-group-item p-3 bg-light bg-opacity-20">
                                <span class="text-muted small d-block mb-1 fw-semibold text-uppercase">Materia</span>
                                <span class="fs-5 fw-bold text-dark" th:text="*{materia.nombre}">Nombre Materia</span>
                            </li>

                            <!-- Régimen / Tipo -->
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <span class="text-muted fw-medium">Tipo de materia</span>
                                <span
                                    class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2 rounded-pill text-uppercase small fw-bold"
                                    th:text="*{tipoMateria}">Tipo</span>
                            </li>

                            <!-- Día -->
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <span class="text-muted fw-medium">Día Asignado</span>
                                <span class="text-dark fw-bold">
                                    <i class="bi bi-calendar-check text-success me-1"></i>
                                    <span th:text="*{diasSemana}">Día</span>
                                </span>
                            </li>

                            <!-- Bloque Horario -->
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <span class="text-muted fw-medium">Rango Horario</span>
                                <span class="badge bg-dark px-3 py-2 rounded-pill fw-semibold font-monospace fs-6">
                                    <i class="bi bi-clock me-1 text-warning"></i>
                                    <span th:text="*{horaInicio} + ' - ' + *{horaFin}">00:00 - 00:00</span>
                                </span>
                            </li>

                        </ul>

                        <!-- Acciones Siguientes de Navegación -->
                        <div class="d-grid gap-2">
                            <a th:href="@{/horario/listado}"
                                class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-table"></i> Ver todo el cronograma
                            </a>
                            <a th:href="@{/horario/nuevo}"
                                class="btn btn-outline-success rounded-pill py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-plus-circle"></i> Asignar otro horario
                            </a>
                        </div>
                    </div>

                </div> <!-- /card -->

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragmentos/menu :: footer}"></footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
