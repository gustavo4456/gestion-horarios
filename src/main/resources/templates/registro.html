<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Crear Cuenta - Gestor Académico</title>
</head>

<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- TARJETA PRINCIPAL (TEMA OSCURO) -->
                <div
                    class="card bg-body-tertiary border-secondary border-opacity-25 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-sm-5">

                        <!-- ENCABEZADO E ÍCONO DE REGISTRO -->
                        <div class="text-center mb-4">
                            <div class="bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                style="width: 64px; height: 64px;">
                                <i class="bi bi-person-plus-fill fs-2"></i>
                            </div>
                            <h4 class="fw-bold text-white mb-1">Crear Cuenta</h4>
                            <p class="text-secondary small mb-0">Completá tus datos para darte de alta en el sistema</p>
                        </div>

                        <!-- ALERTA DE ERROR GENERAL (Ej: Usuario ya existente) -->
                        <div th:if="${error}"
                            class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger rounded-3 d-flex align-items-center p-3 mb-4"
                            role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                            <div class="small fw-semibold" th:text="${error}">
                                Error al procesar el registro.
                            </div>
                        </div>

                        <!-- FORMULARIO DE REGISTRO -->
                        <form th:action="@{/registro}" th:object="${usuario}" method="post">

                            <!-- Campo Nombre de Usuario -->
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold text-secondary mb-1">Nombre de
                                    Usuario</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary ps-3">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" id="username" th:field="*{username}"
                                        class="form-control bg-dark border-secondary border-opacity-50 text-light border-start-0 ps-2"
                                        th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                        placeholder="Elegí un usuario" required autofocus />
                                </div>
                                <!-- Error de Validación de Campo -->
                                <div class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('username')}"
                                    th:errors="*{username}">
                                    Error de usuario
                                </div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <label for="password"
                                    class="form-label small fw-semibold text-secondary mb-1">Contraseña</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary ps-3">
                                        <i class="bi bi-key"></i>
                                    </span>
                                    <input type="password" id="password" th:field="*{password}"
                                        class="form-control bg-dark border-secondary border-opacity-50 text-light border-start-0 ps-2"
                                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                        placeholder="••••••••" required />
                                </div>
                                <!-- Error de Validación de Campo -->
                                <div class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}">
                                    Error de contraseña
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <button type="submit"
                                class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm mb-2">
                                <i class="bi bi-person-check me-1"></i> Registrarse
                            </button>

                        </form>

                        <!-- PIE DE TARJETA / ENLACE A LOGIN -->
                        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <p class="small text-secondary mb-0">
                                ¿Ya tenés cuenta?
                                <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none ms-1">
                                    Iniciá sesión acá
                                </a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
