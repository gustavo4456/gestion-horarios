<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Editar Materia - Gestor Académico</title>
</head>

<!-- ⚡ Estructura Flexbox para clavar el footer abajo -->

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú Superior -->
    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <!-- Contenedor Principal Centrado -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Tarjeta del Formulario -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                    <!-- Encabezado con ícono de edición -->
                    <div class="card-header bg-dark text-white p-4 border-0 text-center">
                        <div class="bg-warning bg-opacity-10 text-warning rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center"
                            style="width: 50px; height: 50px;">
                            <i class="bi bi-pencil-square fs-4"></i>
                        </div>
                        <h4 class="mb-0 fw-bold">Modificar Materia</h4>
                        <small class="text-secondary">Actualizá los detalles de la asignatura</small>
                    </div>

                    <!-- Cuerpo del Formulario -->
                    <div class="card-body p-4 bg-white">
                        <form th:action="@{/materia/editar}" th:object="${materiabd}" method="post">

                            <!-- ⚡ Campo ID oculto crucial para la persistencia de datos en JPA -->
                            <input type="number" th:field="*{id}" hidden>

                            <!-- Campo 1: Nombre de la Materia -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold text-muted">Nombre de la
                                    Asignatura</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text bg-light text-secondary border-end-0">
                                        <i class="bi bi-journal-text"></i>
                                    </span>
                                    <input type="text" th:field="*{nombre}" id="nombre" class="form-control ps-2"
                                        th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                        placeholder="Ej: Análisis Matemático I" required>

                                    <div class="invalid-feedback text-start" th:if="${#fields.hasErrors('nombre')}"
                                        th:errors="*{nombre}">
                                        Error en el nombre
                                    </div>
                                </div>
                            </div>

                            <!-- Campo 2: Año de Cursada -->
                            <div class="mb-3">
                                <label for="anioCursada" class="form-label fw-semibold text-muted">Año de
                                    Cursada</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text bg-light text-secondary border-end-0">
                                        <i class="bi bi-calendar3"></i>
                                    </span>
                                    <input type="number" th:field="*{anioCursada}" id="anioCursada"
                                        class="form-control ps-2"
                                        th:classappend="${#fields.hasErrors('anioCursada')} ? 'is-invalid' : ''"
                                        placeholder="Ej: 1" min="1" max="6" required>

                                    <div class="invalid-feedback text-start" th:if="${#fields.hasErrors('anioCursada')}"
                                        th:errors="*{anioCursada}">
                                        Error en el año
                                    </div>
                                </div>
                            </div>

                            <!-- Campo 3: Tipo de Materia (Desplegable) -->
                            <div class="mb-4">
                                <label for="tipoMateria" class="form-label fw-semibold text-muted">Tipo de
                                    Materia</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text bg-light text-secondary border-end-0">
                                        <i class="bi bi-tags"></i>
                                    </span>
                                    <select th:field="*{tipoMateria}" id="tipoMateria" class="form-select ps-2"
                                        th:classappend="${#fields.hasErrors('tipoMateria')} ? 'is-invalid' : ''"
                                        required>
                                        <option th:each="t : ${tiposMaterias}" th:value="${t}" th:text="${t}">Tipo
                                        </option>
                                    </select>

                                    <div class="invalid-feedback text-start" th:if="${#fields.hasErrors('tipoMateria')}"
                                        th:errors="*{tipoMateria}">
                                        Error en el tipo de materia
                                    </div>
                                </div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-grid gap-2 pt-2">
                                <button type="submit"
                                    class="btn btn-warning text-dark rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-check-circle-fill"></i> Guardar Cambios
                                </button>
                                <a th:href="@{/materia/listado}"
                                    class="btn btn-link btn-sm text-secondary rounded-pill text-decoration-none">
                                    Cancelar y volver al listado
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragmentos/menu :: footer}"></footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
