<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Editar Materia</title>
</head>

<body>

    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <h2>Editar Materia</h2>




    <form th:action="@{/materia/editar}" th:object="${materiabd}" method="post">

        <input type="number" th:field="*{id}" hidden>

        <label for="nombre">Nombre:</label>
        <input type="text" th:field="*{nombre}">
        <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: red;">

        </span>

        <label for="anioCursada">Año Cursada:</label>
        <input type="number" th:field="*{anioCursada}">
        <span th:if="${#fields.hasErrors('anioCursada')}" th:errors="*{anioCursada}" style="color: red;">

        </span>

        <label for="tipoMateria">Tipos Materia:</label>
        <select th:field="*{tipoMateria}">
            <option th:each="t : ${tiposMaterias}" th:value="${t}" th:text="${t}">

            </option>
        </select>
        <span th:if="${#fields.hasErrors('tipoMateria')}" th:errors="*{tipoMateria}" style="color: red;">

        </span>

        <button type="submit">Guardar</button>

    </form>
</body>

</html>
