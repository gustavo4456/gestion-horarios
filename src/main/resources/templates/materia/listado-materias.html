<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title th:text="'Listado de Materias (' + ${listadoMaterias.size()} + ')'">Listado de materias</title>
</head>

<!-- ⚡ Estructura Flexbox para clavar el footer abajo -->

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú Superior -->
    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <!-- Contenedor Principal -->
    <main class="container my-5 flex-grow-1">

        <!-- Fila de Encabezado con Título y Botón de Alta -->
        <div class="row align-items-center mb-4 g-3 text-center text-sm-start">
            <div class="col-sm">
                <h2 class="fw-bold text-dark mb-1">
                    <i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Listado de Materias
                </h2>
                <p class="text-muted mb-0 small">
                    Se encontraron <span class="badge bg-secondary" th:text="${listadoMaterias.size()}">0</span>
                    asignaturas registradas
                </p>
            </div>
            <div class="col-sm-auto">
                <a th:href="@{/materia/nueva}"
                    class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm d-inline-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle-fill"></i> Nueva Materia
                </a>
            </div>
        </div>

        <!-- Tarjeta que contenedor de la Tabla -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">

                <!-- Contenedor responsivo por si la tabla es muy ancha en móviles -->
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark text-uppercase small" style="letter-spacing: 0.5px;">
                            <tr>
                                <th class="ps-4" style="width: 10%;">ID</th>
                                <th style="width: 40%;">Nombre de la Asignatura</th>
                                <th style="width: 20%;">Año de Cursada</th>
                                <th style="width: 15%;">Tipo / Régimen</th>
                                <th class="text-end pe-4" style="width: 15%;">Opciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Fila dinámica con Thymeleaf -->
                            <tr th:each="m : ${listadoMaterias}">
                                <td class="ps-4 fw-semibold text-muted" th:text="${m.id}">0</td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${m.nombre}">Nombre</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                                        <i class="bi bi-calendar3 text-primary me-1"></i>
                                        <span th:text="${m.anioCursada} + '° Año'">1° Año</span>
                                    </span>
                                </td>
                                <td>
                                    <span
                                        class="badge bg-info bg-opacity-10 text-info fw-semibold px-3 py-2 border border-info border-opacity-25 rounded-pill text-uppercase small"
                                        th:text="${m.tipoMateria}">
                                        Tipo
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <!-- Grupo de botones estilizados -->
                                    <div class="btn-group btn-group-sm shadow-sm rounded-pill overflow-hidden"
                                        role="group">
                                        <!-- Botón Editar -->
                                        <a th:href="@{/materia/{id}/form-editar(id=${m.id})}"
                                            class="btn btn-warning text-dark px-3" title="Editar materia">
                                            <i class="bi bi-pencil-fill"></i>
                                        </a>
                                        <!-- Botón Eliminar -->
                                        <a th:href="@{/materia/{id}/eliminar(id=${m.id})}" class="btn btn-danger px-3"
                                            title="Eliminar materia"
                                            onclick="return confirm('¿Estás seguro de que querés eliminar esta materia?');">
                                            <i class="bi bi-trash3-fill"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <!-- Estado vacío: Se muestra solo si la lista viene vacía -->
                            <tr th:if="${listadoMaterias.isEmpty()}">
                                <td colspan="5" class="text-center py-5 bg-white">
                                    <i class="bi bi-inbox text-muted display-4 d-block mb-3"></i>
                                    <h5 class="text-secondary fw-semibold">No hay materias cargadas</h5>
                                    <p class="text-muted small">Hacé click en "Nueva Materia" para registrar la primera.
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragmentos/menu :: footer}"></footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
