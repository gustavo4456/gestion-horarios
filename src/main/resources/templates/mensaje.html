<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS e Íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Confirmación - Gestor Académico</title>
</head>

<!-- ⚡ Estructura Flexbox para mantener el footer abajo -->

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú Superior -->
    <header th:replace="~{fragmentos/menu :: menu}"></header>

    <!-- Contenedor Principal Centrado -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Tarjeta de Mensaje/Éxito -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden text-center p-5 bg-white">

                    <!-- Ícono Grande de Éxito con Animación Sutil -->
                    <div class="text-success mb-4">
                        <i class="bi bi-check-circle-fill" style="font-size: 4.5rem;"></i>
                    </div>

                    <!-- Mensaje Dinámico enviado desde el Controlador -->
                    <h3 class="fw-bold text-dark mb-3" th:text="${msj}">
                        Operación realizada con éxito
                    </h3>

                    <p class="text-muted small px-3 mb-4">
                        Los cambios fueron procesados de manera segura y ya impactaron en la base de datos del sistema.
                    </p>

                    <hr class="my-4 opacity-25">

                    <!-- Botones de redirección rápida -->
                    <div class="d-grid gap-2">
                        <!-- ⚡ Acción Principal: Dinámica según el módulo que llamó a la vista -->
                        <a th:href="${urlRetorno != null} ? @{${urlRetorno}} : @{/}"
                            class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-arrow-left-short fs-5"></i> Volver al Listado
                        </a>

                        <!-- Acción Secundaria: Ir al Home -->
                        <a th:href="@{/}"
                            class="btn btn-outline-secondary btn-sm rounded-pill py-2 text-decoration-none">
                            <i class="bi bi-house-door me-1"></i> Ir al Inicio
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragmentos/menu :: footer}"></footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
